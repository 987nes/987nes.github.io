var CAND=new Int16Array(MAXE);
function majArmes(){
  var k,a,j,e,dx,dy,d,nb,x,y,ang,c,s,p,i,n;
  for(k=0;k<S.nA;k++){a=S.armes[k];
    switch(a.id){
    case 0: /* Poing Levé */
      if(a.cd>0)a.cd--;
      if(a.cd<=0){
        nb=plusProches(240,a.nb<3?a.nb:3);
        if(nb>0){
          for(j=0;j<a.nb;j++){
            e=E[PP[j%nb]];dx=e.x-S.px;dy=e.y-(S.py-10);d=Math.sqrt(dx*dx+dy*dy);if(d<0.001){dx=1;dy=0;d=1;}
            dx/=d;dy/=d;
            if(j>=nb){ang=(j&1)?70:-70;c=cs(ang);s=sn(ang);x=dx*c-dy*s;y=dx*s+dy*c;dx=x;dy=y;}
            tirer(0,S.px,S.py-10,dx,dy,360,54,a);
          }
          a.cd=a.cdMax;ev(EV_TIR,0);
        }
      }
      if(a.evo){a.t++;if(a.t>=240){a.t=0;ev(EV_ONDE,S.px,S.py,140*(a.r/9),4);zone(S.px,S.py,140*(a.r/9),Math.round(a.deg*2),40,0,1);}}
      break;
    case 1: /* Couteau Suisse */
      if(a.cd>0)a.cd--;
      if(a.cd<=0){
        a.cd=a.cdMax;nb=a.nb;
        for(j=0;j<nb;j++){
          if(a.evo)ang=j*180;else ang=(nb===1)?0:(nb===2?(j===0?-60:60):(j-1)*60);
          c=cs(ang);s=sn(ang);x=S.dx*c-S.dy*s;y=S.dx*s+S.dy*c;
          p=tirer(1,S.px,S.py-8,x,y,300,400,a);
          if(p){p.perce=-1;p.outil=a.evo?(j%4):0;if(a.evo&&j===3){p.deg=1;p.outil=4;}}
        }
        ev(EV_TIR,1);
      }
      break;
    case 2: /* Cor des Alpes */
      if(a.cd>0)a.cd--;
      if(a.cd<=0){
        a.cd=a.cdMax;ev(EV_ONDE,S.px,S.py,a.r,0);ev(EV_TIR,2);
        zone(S.px,S.py,a.r,a.deg,a.pousse,0,0);
        if(a.evo){for(i=0;i<S.nPE;i++){p=PE[i];dx=p.x-S.px;dy=p.y-S.py;if(dx*dx+dy*dy<a.r*a.r){ev(EV_ECLAT,p.x,p.y);p.vie=0;}}}
      }
      break;
    case 3: /* Caquelon Orbital */
      if(a.evo)a.actif=1;
      else{a.t++;if(a.actif){if(a.t>=240){a.actif=0;a.t=0;}}else if(a.t>=a.repos){a.actif=1;a.t=0;ev(EV_TIR,3);}}
      if(a.actif){
        var anneaux=a.evo?2:1,an,ray,base,pr=11*(a.r/ARMES[3].r[a.evo?5:a.niv-1]);
        for(an=0;an<anneaux;an++){
          ray=an===0?a.r:a.r*100/60;base=an===0?S.n*15:-S.n*11;
          for(j=0;j<a.nb;j++){
            ang=base+Math.floor(j*NA/a.nb);x=S.px+cs(ang)*ray;y=S.py-6+sn(ang)*ray;
            n=requete(x,y,pr);
            for(i=0;i<n;i++){e=E[Q[i]];if(e.cdOrb>S.n)continue;e.cdOrb=S.n+30;if(e.t!==T_BOSS){e.lent=60;e.lentF=a.lent;}
              dx=e.x-S.px;dy=e.y-S.py;d=Math.sqrt(dx*dx+dy*dy)+0.001;blesser(Q[i],a.deg,dx/d*0.8,dy/d*0.8,3);}
          }
        }
      }
      break;
    case 4: /* Raclette Laser (pose aussi du fromage à l'arrêt pendant la démonstration d'une nouvelle arme) */
      if(S.marche||S.n<S.demoFin){a.t++;if(a.t>=(S.fxChoco>0?8:12)){a.t=0;flaque(S.px,S.py+9,a);}}
      break;
    case 6: /* Bombe au Fromage : vers le groupe le plus serré à moins de 230 */
      if(a.cd>0)a.cd--;
      if(a.cd<=0){
        c=0;n=S.nE;
        for(i=0;i<n&&c<32;i++){e=E[i];if(e.mort)continue;dx=e.x-S.px;dy=e.y-S.py;if(dx*dx+dy*dy<52900)CAND[c++]=i;}
        if(c>0){
          a.cd=a.cdMax;
          for(j=0;j<c;j++){e=E[CAND[j]];DENS[j]=requete(e.x,e.y,50);}
          for(j=0;j<a.nb&&S.nB<MAXB;j++){
            var best=-1,bs=-1,q2,f2;
            for(q2=0;q2<c;q2++)if(DENS[q2]>bs){bs=DENS[q2];best=q2;}
            if(best<0||bs<0){/* plus de groupe distinct : la bombe suivante tombe à côté de la première */
              e=E[CAND[0]];lancerBombe(e.x+(j&1?44:-44),e.y+(j&2?30:-30),a,0);continue;}
            e=E[CAND[best]];lancerBombe(e.x,e.y,a,0);
            for(q2=0;q2<c;q2++){if(DENS[q2]<0)continue;f2=E[CAND[q2]];dx=f2.x-e.x;dy=f2.y-e.y;if(dx*dx+dy*dy<4900)DENS[q2]=-1;}
          }
          ev(EV_TIR,6);
        }
      }
      break;
    case 5: /* Bougie Verte */
      if(a.cd>0)a.cd--;
      if(a.cd<=0){
        c=0;n=S.nE;
        for(i=0;i<n;i++){e=E[i];if(e.mort)continue;dx=e.x-S.px;dy=e.y-S.py;
          if(a.evo){if(dx<190&&dx>-190&&dy<330&&dy>-330)CAND[c++]=i;}else if(dx*dx+dy*dy<48400)CAND[c++]=i;}
        if(c>0){
          a.cd=a.cdMax;nb=a.nb;
          for(j=0;j<nb&&S.nPI<MAXPI;j++){
            if(j<c){i=j+Math.floor(S.rCbt()*(c-j));s=CAND[i];CAND[i]=CAND[j];CAND[j]=s;e=E[s];x=e.x;y=e.y;}
            else{x=S.px+(S.rCbt()*2-1)*170;y=S.py;if(!a.evo)break;}
            p=PI[S.nPI++];p.x=x;p.y=a.evo?S.py:y;p.r=a.r;p.t=0;p.deg=a.deg;p.col=a.evo?1:0;
          }
          ev(EV_TIR,5);
        }
      }
      break;
    }
  }
}
var DENS=new Int16Array(64);
/* Bombe en cloche : 0,6 s de vol (les éclats du Gruyère à Fragmentation : 0,3 s). */
function lancerBombe(x,y,a,frag){
  if(S.nB>=MAXB)return;
  var b=BO[S.nB++];b.x0=frag?a.x0:S.px;b.y0=frag?a.y0:S.py-14;b.x1=x;b.y1=y;b.t=0;b.T=frag?18:36;
  b.deg=frag?Math.round(a.deg*0.5):a.deg;b.r=frag?a.r*0.62:a.r;b.lent=a.lent;b.frag=frag?1:0;b.evo=frag?0:(a.evo?1:0);
  if(!frag)ev(EV_LANCE,b.x0,b.y0,x,y,b.T);
}
function majBombes(){
  var i,b,n,q,e,dx,dy,d,t,k;
  for(i=0;i<S.nB;i++){b=BO[i];b.t++;
    if(b.t>=b.T){
      n=requete(b.x1,b.y1,b.r);
      for(q=0;q<n;q++){e=E[Q[q]];if(e.t!==T_BOSS){e.lent=90;e.lentF=b.lent;}
        dx=e.x-b.x1;dy=e.y-b.y1;d=Math.sqrt(dx*dx+dy*dy)+0.001;blesser(Q[q],b.deg,dx/d*2.2,dy/d*2.2,0);}
      ev(EV_BOMBE,b.x1,b.y1,b.r,b.frag);
      /* Gruyère à Fragmentation : quatre éclats en croix */
      if(b.evo){var src={x0:b.x1,y0:b.y1,deg:b.deg,r:b.r,lent:b.lent,evo:0};for(k=0;k<4;k++)lancerBombe(b.x1+cs(180+k*360)*58,b.y1+sn(180+k*360)*58,src,1);}
      t=BO[i];BO[i]=BO[S.nB-1];BO[S.nB-1]=t;S.nB--;i--;
    }
  }
}
function flaque(x,y,a){

  f.x=x;f.y=y;f.r=a.r;f.vie=a.duree;f.vieMax=a.duree;f.deg=a.deg;f.lent=a.lent;f.graine=S.n;
}
function majFlaques(n){

      for(q=0;q<nq;q++){e=E[Q[q]];if(e.cdPud>n)continue;e.cdPud=n+30;if(f.lent>0&&e.t!==T_BOSS){e.lent=40;e.lentF=f.lent;}blesser(Q[q],f.deg,0,0,3);}}

}
function majPieux(){
  var i,p,t,k,e,dx,dy,n;
  for(i=0;i<S.nPI;i++){p=PI[i];p.t++;
    if(p.t===18){

      else zone(p.x,p.y,p.r,p.deg,0,24,0);

}
function majProjectiles(){
  var i,p,n,q,ei,e,h,hn,vu,dx,dy,d,t,v;
  for(i=0;i<S.nP;i++){p=P[i];
    p.tx[p.ti]=p.x;p.ty[p.ti]=p.y;p.ti=(p.ti+1)&7;if(p.tn<8)p.tn++;
    if(p.type===0){p.x+=p.vx;p.y+=p.vy;p.vie--;}
    else{
      p.vie--;
      if(p.phase===0){p.x+=p.vx;p.y+=p.vy;p.dist+=5;if(p.dist>=p.portee){p.phase=1;p.hitN=0;}}
      else{dx=S.px-p.x;dy=S.py-8-p.y;d=Math.sqrt(dx*dx+dy*dy);v=6;if(d<14)p.vie=0;else{p.vx=dx/d*v;p.vy=dy/d*v;p.x+=p.vx;p.y+=p.vy;}}
    }
    if(p.vie>0){
      n=requete(p.x,p.y,p.r);
      for(q=0;q<n;q++){ei=Q[q];e=E[ei];
        hn=p.hitN<12?p.hitN:12;vu=0;for(h=0;h<hn;h++)if(p.hit[h]===e.uid){vu=1;break;}
        if(vu)continue;
        p.hit[p.hitN%12]=e.uid;p.hitN++;
        blesser(ei,p.deg,p.vx*0.4,p.vy*0.4,p.type===0&&p.perce<0?1:0);
        if(p.type===0){if(p.perce===0){p.vie=0;ev(EV_ECLAT,p.x,p.y);break;}else if(p.perce>0)p.perce--;}
      }
    }
    if(p.vie<=0){t=P[i];P[i]=P[S.nP-1];P[S.nP-1]=t;S.nP--;i--;}
  }
}

/* ---------- ennemis ---------- */
function tirEnnemi(x,y,nx,ny){
  if(S.nPE>=MAXPE)return;var p=PE[S.nPE++];p.x=x;p.y=y;p.ox=x;p.oy=y;p.vx=nx*95/HZ;p.vy=ny*95/HZ;p.vie=270;p.rot=0;ev(EV_TIRENN,x,y);
}
function majEnnemis(n){
  var px=S.px,py=S.py,vm=S.vitMult/HZ,nE0=S.nE,i,e,dx,dy,d,nx,ny,v,ph,k,a0,a1,cnt,j,o,sx,sy,rr,s2,s,nq,q,sg,cx,cy;
  for(i=0;i<nE0;i++){e=E[i];if(e.mort)continue;
    if(e.flash>0)e.flash--;
    dx=px-e.x;dy=py-e.y;d=Math.sqrt(dx*dx+dy*dy);
    if(d>520&&(e.t!==T_BOSS||d>600)){perim();e.x=PX;e.y=PY;e.ox=PX;e.oy=PY;e.kx=0;e.ky=0;if(e.t===T_PING){e.et=0;e.tm=0;}continue;}
    if(d>0.001){nx=dx/d;ny=dy/d;}else{nx=1;ny=0;}
    if(e.kx!==0||e.ky!==0){e.x+=e.kx;e.y+=e.ky;e.kx*=0.8;e.ky*=0.8;if(e.kx<0.02&&e.kx>-0.02)e.kx=0;if(e.ky<0.02&&e.ky>-0.02)e.ky=0;}
    v=e.vit*vm;
    if(e.lent>0){e.lent--;v*=(1-e.lentF);}
    if(e.buff>0){e.buff--;v*=1.3;}
    if(e.etourdi>0){e.etourdi--;}
    else switch(e.t){
      case T_GREN:
        ph=(n+e.uid*7)%48;if(ph<24){e.x+=nx*v*2;e.y+=ny*v*2;e.et=1;}else e.et=0;break;
      case T_TOUTOU:
        ph=(n-e.nais)%210;if(ph<120){e.x+=nx*v;e.y+=ny*v;e.et=0;}else{e.x+=nx*v*0.37;e.y+=ny*v*0.37;e.et=1;}break;
      case T_CLOWN:
        if(d>180){e.x+=nx*v;e.y+=ny*v;}
        if(d<300){if(--e.cdTir<=0){e.cdTir=150;tirEnnemi(e.x,e.y-4,nx,ny);e.et=12;}}
        if(e.et>0)e.et--;
        break;
      case T_PING:
        if(e.et===0){e.x+=nx*v;e.y+=ny*v;if(d<200){e.et=1;e.tm=42;e.dx=nx;e.dy=ny;}}
        else if(e.et===1){if(--e.tm<=0){e.et=2;e.tm=56;}}
        else if(e.et===2){e.x+=e.dx*5.3333;e.y+=e.dy*5.3333;if(--e.tm<=0){e.et=3;e.tm=60;}}
        else{if(--e.tm<=0)e.et=0;}
        break;
      case T_VEND:
        if(d>150){e.x+=nx*v;e.y+=ny*v;}else if(d<130){e.x-=nx*v;e.y-=ny*v;}else{sg=(e.uid&1)?0.6:-0.6;e.x-=ny*v*sg;e.y+=nx*v*sg;}
        if((n+e.uid)%20===0){nq=requete(e.x,e.y,90);for(q=0;q<nq;q++)if(Q[q]!==i)E[Q[q]].buff=30;}
        break;
      case T_BULLE:
        if(e.et===0){e.x+=nx*v;e.y+=ny*v;if(d<40){e.et=1;e.tm=48;}}
        else{e.x+=nx*v*0.3;e.y+=ny*v*0.3;if(--e.tm<=0){e.mort=1;onde(e.x,e.y,48,40,20,0);ev(EV_MORT,e.x,e.y,T_BULLE,e.taille,e.v);continue;}}
        break;
      case T_BOSS:
        if(S.bossFuite===1){if(d<200){e.x-=nx*v*1.2;e.y-=ny*v*1.2;}}
        else if(d>40){e.x+=nx*v;e.y+=ny*v;}
        break;
      default:
        e.x+=nx*v;e.y+=ny*v;
    }
    /* séparation : 4 voisins de la cellule */
    if(e.c>=0&&e.t<T_CHAT&&!(e.t===T_PING&&e.et===2)){
      a0=cellDeb[e.c];a1=cellDeb[e.c+1];cnt=a1-a0-1;if(cnt>4)cnt=4;k=e.ci;
      while(cnt-->0){
        k++;if(k>=a1)k=a0;j=cellIt[k];o=E[j];if(o.mort||j===i)continue;
        sx=e.x-o.x;sy=e.y-o.y;rr=(e.r+o.r)*0.85;s2=sx*sx+sy*sy;
        if(s2<rr*rr){if(s2>0.0001){s=Math.sqrt(s2);e.x+=sx/s*0.5;e.y+=sy/s*0.5;}else{e.x+=(e.uid&1)?0.5:-0.5;e.y+=(e.uid&2)?0.5:-0.5;}}
      }
    }
    if(dx>1)e.face=1;else if(dx<-1)e.face=-1;
    if(e.deg>0&&S.inv<=0){cx=px-e.x;cy=py-e.y;rr=e.r+12;if(cx*cx+cy*cy<rr*rr)blesserJoueur(e.deg,e.t,e.v);}
  }
}
function majBoss(){
  var k,B,i,e,n,dx,dy,d,b;
  if(S.bossVivant){
    b=S.bossRef;
    if(!S.bossFuite&&b.pv<=b.pvMax*0.1){S.bossFuite=1;S.bFuiteT=480;S.bAspiT=0;ev(EV_BANDEAU,B_PAUSE);ev(EV_PAROLE,b.x,b.y-50,1);}
    if(S.bossFuite===1){if(++S.bGem>=60){S.bGem=0;gemme(b.x,b.y+20,5,0);}if(--S.bFuiteT<=0){S.bossFuite=2;S.bTapis=200;ev(EV_PAROLE,b.x,b.y-50,2);}}
    else{
      if(++S.bTapis>=(S.liquidation?240:360)){
        S.bTapis=0;S.bOrient^=1;
        for(k=0;k<3;k++){B=S.bandes[k];B.on=1;B.h=S.bOrient;B.t=0;
          if(k===0)B.c=B.h?S.py:S.px;else B.c=B.h?S.py+(S.rApp()*2-1)*270:S.px+(S.rApp()*2-1)*150;}
        ev(EV_TAPIS,0);
      }
      if(++S.bAspi>=600){S.bAspi=0;S.bAspiT=150;ev(EV_ASPI);}
      if(S.bAspiT>0){S.bAspiT--;dx=b.x-S.px;dy=b.y-S.py;d=Math.sqrt(dx*dx+dy*dy);if(d>30){S.px+=dx/d*70/HZ;S.py+=dy/d*70/HZ;}}
    }
  }
  for(k=0;k<3;k++){B=S.bandes[k];if(!B.on)continue;B.t++;
    if(B.t===90){
      ev(EV_TAPIS,1);n=S.nE;
      for(i=0;i<n;i++){e=E[i];if(e.mort||e.t>=T_CHAT&&e.t!==T_CHAPEAU)continue;dx=e.x-S.px;dy=e.y-S.py;if(dx>200||dx<-200||dy>340||dy<-340)continue;
        d=B.h?e.y-B.c:e.x-B.c;if(d<40&&d>-40)tuer(i);}
    }
    if(B.t>=90&&B.t<150&&S.inv<=0){d=B.h?S.py-B.c:S.px-B.c;if(d<40&&d>-40)blesserJoueur(20,T_BOSS);}
    if(B.t>=150)B.on=0;
  }
}
function majProjEnnemis(){

/* ---------- gemmes, ramassages, niveaux ---------- */
/* 0.4 : au-delà du niveau 12, chaque niveau coûte davantage (la puissance ne s'emballe plus au milieu de partie) */
function xpPour(n){n=n<119?n:119;return n>=REGL.xpNiv?Math.round(XPT[n]*REGL.xpHaut):XPT[n];}
function gagnerXP(v){
  S.xp+=v;
  while(S.xp>=S.xpSuiv){S.xp-=S.xpSuiv;S.niveau++;S.xpSuiv=xpPour(S.niveau);S.attente++;S.ondeNiv=1;}
}
/* Onde de choc de montée de niveau : jouée au pas qui suit le choix de carte (respiration pour le débutant). */
function ondeNiveau(){
  var r=REGL.ondeNiv;
  ev(EV_ONDE,S.px,S.py,r,5);
  zone(S.px,S.py,r,12+2*S.niveau,70,30,1);
}
/* ---------- trésors ---------- */
var POIDS_T=new Float64Array(5);
function majTresor(){
  var t=S.tre,dx,dy,a,d,k,tot,r,ty;
  if(S.fxFondue>0){S.fxFondue--;S.pv+=4/HZ;if(S.pv>S.pvMax)S.pv=S.pvMax;}
  if(S.fxMeringue>0&&--S.fxMeringue===0)recalc();
  if(S.fxChoco>0&&--S.fxChoco===0)recalc();
  if(t.on){
    dx=S.px-t.x;dy=S.py-t.y;
    if(dx*dx+dy*dy<1156)prendreTresor();
    else if(S.n-t.nais>=1200){t.on=0;ev(EV_TRESFIN,t.type,t.x,t.y);}
  }else if(S.n>=S.treProchain&&!S.bossFuite&&REGL.tresors){
    /* le premier est toujours un chocolat : le « waouh » arrive dans les 25 premières secondes */
