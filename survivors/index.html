var SIM=(function(){

var M_CARTE=1,M_VOTE=2;

/* Table de sinus arrondie au millionième : aucune fonction transcendante, nulle part dans la simulation.
   0.6 : la table elle-même est calculée par une série de Taylor (+ − × ÷ seulement, résultats identiques sur tous les
   moteurs JavaScript) sur le premier quadrant, puis par symétrie ; elle est identique, valeur pour valeur, à l'ancienne
   table tirée de Math.sin (vérifié sur les 1 440 entrées). */
var SINT=new Float64Array(NA);
function sinSerie(x){var x2=x*x,t=x,s=x,k;for(k=1;k<=12;k++){t=-t*x2/((2*k)*(2*k+1));s+=t;}return s;}
(function(){var i,j,v,D=NA/2;for(i=0;i<NA;i++){j=i%D;if(j>NA/4)j=D-j;v=sinSerie(j*3.141592653589793/D);if(i>=D)v=-v;SINT[i]=Math.round(v*1e6)/1e6+0;}})();
function sn(a){a%=NA;if(a<0)a+=NA;return SINT[a];}
function cs(a){return sn(a+360);}

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function fnv1a(s){var h=0x811c9dc5;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193);}return h>>>0;}

/* =====================================================================

  cellDeb.fill(0);
  for(i=0;i<n;i++){e=E[i];c=cel(e.y-gy0)*GW+cel(e.x-gx0);e.c=c;cellDeb[c+1]++;}
  for(i=0;i<GW*GW;i++){cellDeb[i+1]+=cellDeb[i];cellCur[i]=cellDeb[i];}

  for(cy=y0;cy<=y1;cy++)for(cx=x0;cx<=x1;cx++){

function bClown(e,m){if(m.d>180){e.x+=m.nx*m.v;e.y+=m.ny*m.v;}if(m.d<300){if(--e.cdTir<=0){e.cdTir=150;tirEnnemi(e.x,e.y-4,m.ux,m.uy);e.et=12;}}if(e.et>0)e.et--;return 0;}

  if(e.et===0){e.x+=m.nx*v;e.y+=m.ny*v;if(m.d<200){e.et=1;e.tm=42;e.dx=m.ux;e.dy=m.uy;}}

function bVendeur(e,m){var v=m.v,sg,nq,q;
  if(m.d>150){e.x+=m.nx*v;e.y+=m.ny*v;}else if(m.d<130){e.x-=m.ux*v;e.y-=m.uy*v;}else{sg=(e.uid&1)?0.6:-0.6;e.x-=m.uy*v*sg;e.y+=m.ux*v*sg;}
  if((m.n+e.uid)%20===0){nq=requete(e.x,e.y,90);for(q=0;q<nq;q++)if(Q[q]!==m.i)E[Q[q]].buff=30;}

function majEnnemis(n){
  var px=S.px,py=S.py,vm=S.vitMult/HZ,nE0=S.nE,i,e,dx,dy,d,nx,ny,v,k,a0,a1,cnt,j,o,sx,sy,rr,s2,s,cx,cy,ux,uy,fe,tc,gi,gj,fn;
  for(i=0;i<nE0;i++){e=E[i];if(e.mort)continue;
    if(e.flash>0)e.flash--;
    dx=px-e.x;dy=py-e.y;d=Math.sqrt(dx*dx+dy*dy);
    if(d>520&&(e.t!==T_BOSS||d>600)){perim();e.x=PX;e.y=PY;e.ox=PX;e.oy=PY;e.kx=0;e.ky=0;if(ENN[e.t].razEtat){e.et=0;e.tm=0;}continue;}
    if(d>0.001){nx=dx/d;ny=dy/d;}else{nx=1;ny=0;}

    if(dx>1)e.face=1;else if(dx<-1)e.face=-1;
    if(e.deg>0&&S.inv<=0){cx=px-e.x;cy=py-e.y;rr=e.r+12;if(cx*cx+cy*cy<rr*rr)blesserJoueur(e.deg,e.t,e.v);}
  }

function majTresor(){
  var t=S.tre,dx,dy,a,d,k,tot,r,ty,T;

  for(k=0;k<TRESORS.length;k++){if(S.fx[k]<=0)continue;T=TRESORS[k];S.fx[k]--;if(T.parPas)T.parPas();if(S.fx[k]===0&&T.effets)recalc();}

var EL_G=new Int8Array(64),EL_I=new Int8Array(64),EL_P=new Int8Array(64);
function tirerCartes(){
  var n=0,i,k,c=0,tot,r,j,ca,nv=S.niveau-S.attente+1;
  /* niveau 2 : trois armes nouvelles ; niveau 3 : uniquement des armes (une troisième, ou une arme plus forte) */
  if(nv===2){for(i=0;i<NARMES;i++)if(idxArme(i)<0){EL_G[n]=0;EL_I[n]=i;EL_P[n]=1;n++;}}
  else{
    for(i=0;i<NARMES;i++){k=idxArme(i);if(k<0){if(S.nA<4){EL_G[n]=0;EL_I[n]=i;EL_P[n]=nv===3?2:1;n++;}}else if(!S.armes[k].evo&&S.armes[k].niv<5){EL_G[n]=0;EL_I[n]=i;EL_P[n]=2;n++;}}
    if(nv!==3||n<3)for(i=0;i<PASSIFS.length;i++){k=idxPassif(i);if(k<0){if(S.nPa<4){EL_G[n]=1;EL_I[n]=i;EL_P[n]=passifLie(i)?3:1;n++;}}else if(S.passifs[k].niv<3){EL_G[n]=1;EL_I[n]=i;EL_P[n]=passifLie(i)?3:2;n++;}}
  }
  var niv3=(nv===4),lie=-1,nl=0;

  if(niv3){for(i=0;i<n;i++)if(EL_G[i]===1&&passifLie(EL_I[i]))nl++;if(nl>0){r=Math.floor(S.rCar()*nl);for(i=0;i<n;i++)if(EL_G[i]===1&&passifLie(EL_I[i])){if(r===0){lie=EL_I[i];break;}r--;}}}
  while(c<3&&n>0){
    tot=0;for(i=0;i<n;i++)tot+=EL_P[i];
    r=S.rCar()*tot;j=0;for(i=0;i<n;i++){r-=EL_P[i];if(r<0){j=i;break;}j=i;}
    ca=S.cartes[c++];ca.genre=EL_G[j];ca.id=EL_I[j];
    if(ca.genre===0){k=idxArme(ca.id);ca.niv=k<0?0:S.armes[k].niv;}else{k=idxPassif(ca.id);ca.niv=k<0?0:S.passifs[k].niv;}
    n--;EL_G[j]=EL_G[n];EL_I[j]=EL_I[n];EL_P[j]=EL_P[n];
  }
  /* niveau 4 : le passif lié à une arme possédée est garanti parmi les trois cartes */
  if(lie>=0){j=0;for(i=0;i<c;i++)if(S.cartes[i].genre===1&&passifLie(S.cartes[i].id))j=1;if(!j){ca=S.cartes[c-1];ca.genre=1;ca.id=lie;ca.niv=0;}}
  /* build complet : surcharges empilables (et une fondue), tirées sans doublon */
  if(c<3){var NS=SURCHARGES.length,rs=[],m4=NS+1;for(i=0;i<=NS;i++)rs.push(i);while(c<3){j=Math.floor(S.rCar()*m4);k=rs[j];rs[j]=rs[--m4];ca=S.cartes[c++];if(k===NS){ca.genre=2;ca.id=0;ca.niv=0;}else{ca.genre=3;ca.id=k;ca.niv=S.sur[k];}}}
  S.modal=M_CARTE;ev(EV_NIVEAU,nv);
}

/* tableau (facultatif, 0.6) : seulement pour une partie d'entraînement jouée sur un tableau forcé ; les parties classées
   utilisent toujours le tableau de leur graine, et le serveur rejoue avec les quatre premiers arguments. */
function rejouer(graine,journal,nPas,choix,tab){
  var st=creer(graine,tab),ic=0,garde=0,i;
  for(i=0;i<nPas&&i<journal.length;i++)if(journal[i]>16)return null;
  while(!st.fini&&st.n<nPas&&garde++<400000){
    if(st.modal){
      if(ic>=choix.length)break;
      var c=choix[ic+1];ic+=2;
      if(c<=2)choisir(st,c);else if(c===3)relancer(st);else voter(st,c===5);
    }else pas(st,journal[st.n]);
  }
  return st;
}

var DIRX=new Float64Array(17),DIRY=new Float64Array(17);(function(){for(var d=1;d<=16;d++){DIRX[d]=cs((d-1)*90);DIRY[d]=sn((d-1)*90);}})();
function quantifier(fx,fy){var best=0,bd=-1e9,d,v;for(d=1;d<=16;d++){v=fx*DIRX[d]+fy*DIRY[d];if(v>bd){bd=v;best=d;}}return best;}
function botDir(st){
  lier(st);
  var fx=0,fy=0,px=S.px,py=S.py,i,e,dx,dy,d,Rr,w,p,k,B,c,g,best,bd;
  for(i=0;i<S.nE;i++){e=E[i];if(e.deg===0&&e.t!==T_BULLE)continue;
    dx=px-e.x;dy=py-e.y;d=Math.sqrt(dx*dx+dy*dy)+0.01;Rr=80+e.r*2+(e.t===T_BOSS?80:0);
    if(d<Rr){w=(Rr-d)/Rr;w=w*w*(e.t===T_BOSS?14:(e.t===T_CHAT?8:4));fx+=dx/d*w-dy/d*w*0.35;fy+=dy/d*w+dx/d*w*0.35;}
    if(e.t===T_PING&&(e.et===1||e.et===2)&&d<330){c=dx*e.dy-dy*e.dx;if(c>-40&&c<40){w=c>=0?2.5:-2.5;fx+=e.dy*w;fy-=e.dx*w;}}
  }
  for(i=0;i<S.nPE;i++){p=PE[i];dx=px-p.x;dy=py-p.y;d=Math.sqrt(dx*dx+dy*dy)+0.01;if(d<70){c=dx*p.vy-dy*p.vx;w=(c>=0?1:-1)*(70-d)/70*3;fx+=p.vy*w;fy-=p.vx*w;}}
  for(k=0;k<3;k++){B=S.bandes[k];if(!B.on)continue;c=B.h?py-B.c:px-B.c;if(c<64&&c>-64){w=(c>=0?1:-1)*14;if(B.h)fy+=w;else fx+=w;}}
  best=-1;bd=1e18;
  for(i=0;i<S.nR;i++){g=R[i];dx=g.x-px;dy=g.y-py;d=dx*dx+dy*dy;if(d<bd){bd=d;best=i;}}
  if(S.tre.on){dx=S.tre.x-px;dy=S.tre.y-py;d=Math.sqrt(dx*dx+dy*dy)+0.01;fx+=dx/d*1.3;fy+=dy/d*1.3;}
  else if(best>=0&&bd<90000){d=Math.sqrt(bd)+0.01;fx+=(R[best].x-px)/d*1.2;fy+=(R[best].y-py)/d*1.2;}
  else{
    best=-1;bd=1e18;

  }

    if(v>bv){bv=v;best=i;}}

  else{
    if(S.tre.on&&S.tre.x>x0&&S.tre.x<x1&&S.tre.y<yb&&S.tre.y>y0)cib=0.5;
    /* ennemis cachés : le bâtiment pâlit à peine, et l'ennemi est redessiné en fantôme par-dessus (la ville reste lisible) */
    for(i=0,n=S.nE;i<n;i++){e=S.E[i];if(e.rx>x0&&e.rx<x1&&e.ry<yb&&e.ry>y0+20){ennCache[i]=1;if(cib>0.82)cib=0.82;}}

/* Ouvre la rédaction d'un post : l'app X si elle est installée (téléphone), sinon le site.
   Android : lien intent:// avec repli automatique vers le site. iPhone/iPad : schéma twitter://, puis le site
   si la page est toujours visible après 1,5 s. Vues web intégrées (dont Telegram) et ordinateur : le site. */
function ouvrirX(txt){
  var e=encodeURIComponent(txt),u='https://x.com/intent/post?text='+e;
  try{
    var w=dansTelegram();if(w&&w.openLink){w.openLink(u);return;}
    var ua=navigator.userAgent||'';
    var ios=/iPhone|iPad|iPod/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1);
    if(/Android/.test(ua)&&ua.indexOf('; wv)')<0){
      /* le lien web de rédaction, remis directement à l'app : c'est lui qui préremplit le texte (twitter://post ne le fait pas) */
      location.href='intent://twitter.com/intent/tweet?text='+e+'#Intent;scheme=https;package=com.twitter.android;S.browser_fallback_url='+encodeURIComponent(u)+';end';
      return;
    }
    if(ios){
      var parti=false,vu=function(){if(document.hidden)parti=true;};
      document.addEventListener('visibilitychange',vu);
      setTimeout(function(){document.removeEventListener('visibilitychange',vu);if(!parti&&!document.hidden)location.href=u;},1500);
      location.href='twitter://post?message='+e;
      return;
    }
    window.open(u,'_blank','noopener');
  }catch(err){try{window.open(u,'_blank','noopener');}catch(e2){}}
}

   qu'une réponse définitive arrive (enregistré ou refusé) ; réseau coupé ou serveur indisponible : gardé pour plus tard. */
function refGarde(){try{var o=JSON.parse(window.localStorage.getItem(REF_CLE)||'null');
  if(o&&typeof o.c==='string'&&/^[A-Z0-9]{4,16}$/.test(o.c)&&Date.now()-(+o.t||0)<14*864e5)return o.c;if(o)window.localStorage.removeItem(REF_CLE);}catch(e){}return'';}
function refOublier(){try{window.localStorage.removeItem(REF_CLE);}catch(e){}}
function avecParrain(c){var r=refGarde();if(r)c.parrain=r;return c;}
function lierParrain(){
  var c=refGarde();if(!c||NET.parrLier||!connecte())return;NET.parrLier=true;
  apiAppel('POST','/api/parrainage/lier',{code:c}).then(function(r){
    NET.parrLier=false;var j=r.json||{};
    if(r.statut===200&&j.parrainage&&typeof j.parrainage.resultat==='string'){resultatParrainage(j.parrainage.resultat,j.parrainage.parrain);return;}
    if(r.statut===0||r.statut>=500||j.erreur==='session_invalide'||j.erreur==='session_absente')return;
    /* serveur d'avant la 0.10 : la route n'existe pas, le code est oublié sans rien dire */
    if(r.statut===404&&j.erreur==='introuvable'){refOublier();return;}
    resultatParrainage(String(j.erreur||''),null);});
}
function texteParrainage(res,parrain){

  setTimeout(function(){

/* ---- essais : ceux du serveur une fois connecté, sinon le compte local de la 0.6 ---- */
/* 0.10 : la vie bonus du parrainage utilisable aujourd'hui compte dans les essais affichés (« 4/4 » : /debut renvoie
   alors essaisMax en la comptant) ; essaisRestants vient du serveur (jour.essaisRestants) quand il le donne */
function essaisMax(){if(connecte())return NET.jour.essaisMax+(vieBonusUtilisable()?1:0);return 3+(SAUV.boost===JOUR?1:0);}

/* ---- compte à rebours : minuit à Zurich, affiché à l'heure de l'appareil ---- */
var cacheMinuit={j:'',t:0};
function decalageZurich(t){
  try{var o={};new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Zurich',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date(t)).forEach(function(q){o[q.type]=q.value;});
    return Date.UTC(+o.year,+o.month-1,+o.day,+o.hour%24,+o.minute,+o.second)-Math.floor(t/1000)*1000;}catch(e){return 3600e3;}
}
function prochainMinuit(){
  var ms=Date.now()+NET.decalage;
  if(NET.prochainJour&&NET.prochainJour>ms-2000)return NET.prochainJour;
  if(cacheMinuit.j===JOUR&&cacheMinuit.t>ms-2000)return cacheMinuit.t;
  var p=JOUR.split('-'),u=Date.UTC(+p[0],+p[1]-1,+p[2]+1),x=u-3600e3;
  x=u-decalageZurich(x);x=u-decalageZurich(x);
  cacheMinuit={j:JOUR,t:x};return x;
}
/* 0.10 : compte à rebours des essais, à l'horloge du serveur (serveur.prochainJour de la session ; sans session, le
   minuit de Zurich calculé ici, comme avant). « HH:MM:SS », ou « MM:SS » sous une heure ; arrivé à zéro, majReseau relit la
   session (essais du nouveau jour sans recharger). null : un concours en cours finit avant minuit (son bandeau fait foi). */
function fmtCompte(ms){var r=Math.max(0,Math.floor(ms/1000)),h=Math.floor(r/3600),m=Math.floor(r/60)%60,s=r%60;
  return(h>0?(h<10?'0':'')+h+':':'')+(m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
function resteAvantEssais(){var fin=prochainMinuit();if(enConcours()&&NET.concours.fin<fin)return null;return Math.max(0,fin-maintenantSrv());}
function texteProchainsEssais(){var r=resteAvantEssais();return r===null?'':T('compte.prochains',fmtCompte(r));}
function texteCompte(){
  var fin=prochainMinuit(),d=fmtCompte(fin-(Date.now()+NET.decalage)),loc=heureLocale(fin-NET.decalage);
  var e=grainePropre();
  return loc==='00:00'?T(e?'titre.compteEssaisMinuit':'titre.compteMinuit',d):T(e?'titre.compteEssais':'titre.compte',d,loc);
}

/* ---- 0.7.3 : budget de pause d'une partie classée en ligne ----
   Le serveur refuse une partie rendue plus de (durée de jeu + regles.pauseMaxS) après son /debut (partie_trop_tardive).
   Pause consommée = temps réel écoulé depuis le début - temps de jeu simulé (S.n / 60) ; restant = pauseMaxS - consommée. */
var absenceT0=0;
function pauseMaxMs(){var r=partieSrv&&typeof partieSrv.pauseMaxS==='number'?partieSrv.pauseMaxS:(NET.regles&&typeof NET.regles.pauseMaxS==='number'?NET.regles.pauseMaxS:1200);return Math.max(0,r)*1000;}
function pauseRestanteMs(){
  if(!classee||!partieSrv||BOT||REVOIR||!S)return null;
  var m=Date.now(),ecoule=m-partieSrv.t0;
  if(typeof partieSrv.debut==='number')ecoule=Math.max(ecoule,m+NET.decalage-partieSrv.debut);
  return pauseMaxMs()-(ecoule-S.n/60*1000);
}
function fmtPause(ms){var s=Math.max(0,Math.ceil(ms/1000)),m=Math.floor(s/60);s%=60;return(m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
function retourAbsence(){
  var d=absenceT0?Date.now()-absenceT0:0;absenceT0=0;

  var r=pauseRestanteMs();if(r===null)return;
  if(r<=0)afficherMsg(T('pause.budgetFini'),C.danger);
  else afficherMsg(T('pause.retour',fmtPause(r)),r<120000?C.danger:C.or);

/* texte d'un refus de fin de partie : « pause trop longue » se suffit à lui-même */
function texteRefus(e){var c=String(e&&typeof e==='object'?e.erreur:(e||''));return c==='partie_trop_tardive'?texteErreur(e):T('net.refusee')+' '+texteErreur(e);}

/* 0.10 : refus de /debut ; essais épuisés avec des vies bonus en banque : dire pourquoi elles ne servent pas */

    if(vb.utiliseeAujourdhui)return T('err.essais_epuises_bonusPris');

/* ---- partie classée : début ---- */

      NET.partie={jeton:e.jeton,graine:e.graine>>>0,essai:e.essai,essaisMax:e.essaisMax,jour:e.jour,debut:e.debut,joueur:NET.joueur.id,pauseMaxS:typeof e.pauseMaxS==='number'?e.pauseMaxS:undefined,t0:Date.now()};

      if(e.viesBonus&&typeof e.viesBonus==='object')NET.jour.viesBonus=e.viesBonus;

/* lancer un essai classé : par le serveur si l'on est en ligne, sinon comme en 0.6 */

/* ---- partie classée : fin (envoi fiable, gardé en stockage local jusqu'à une réponse définitive) ---- */
function lireAttentes(){try{var a=JSON.parse(window.localStorage.getItem('dzo.attente')||'[]');return Array.isArray(a)?a:[];}catch(e){return[];}}
function ecrireAttentes(a){try{window.localStorage.setItem('dzo.attente',JSON.stringify(a.slice(-6)));}catch(e){}}
function retirerAttente(k){ecrireAttentes(lireAttentes().filter(function(x){return x.k!==k;}));}
function finServeur(p){
  var it={k:p.jeton.slice(0,24),joueur:p.joueur,t:Date.now(),jour:p.jour,essai:p.essai,score:SIM.score(S),
    corps:{jeton:p.jeton,version:VERSION,nPas:S.n,journal:SIM.compresser(S),choix:Array.from(S.choix)}};
  var a=lireAttentes();a.push(it);ecrireAttentes(a);

}
function envoyerAttentes(){

  for(i=0;i<a.length;i++){it=a[i];if(!it||!it.corps||Date.now()-it.t>26*3600e3)continue;garde.push(it);if(it.joueur===NET.joueur.id)envoyerFin(it);}
  if(garde.length!==a.length)ecrireAttentes(garde);

function majFin(it,o){if(NET.fin&&NET.fin.k===it.k)for(var c in o)NET.fin[c]=o[c];}
function envoyerFin(it){
  if(NET.enVol[it.k])return;NET.enVol[it.k]=1;majFin(it,{statut:'envoi'});
  apiAppel('POST','/api/partie/fin',it.corps,{delai:30000}).then(function(r){NET.enVol[it.k]=0;resultatFin(it,r);});
}
function resultatFin(it,r){
  var e=r.json||{},c=e.erreur,courant=NET.fin&&NET.fin.k===it.k;

    retirerAttente(it.k);majFin(it,{statut:'validee',score:e.score,rangJour:e.rangJour,scoreJour:e.scoreJour,rangConcours:e.rangConcours||null,scoreConcours:e.scoreConcours||null,
      /* 0.10 : score = score final ; scoreBrut, état du bonus de fidélité, vie bonus (absents d'un serveur plus ancien) */
      partie:e.partie||null,scoreBrut:typeof e.scoreBrut==='number'?e.scoreBrut:null,fidelite:typeof e.fidelite==='string'?e.fidelite:null,
      fidelitePourcent:typeof e.fidelitePourcent==='number'?e.fidelitePourcent:0,vieBonus:e.vieBonus===true});

    rafraichir();return;}
  if(r.statut===202||(r.statut===200&&e.statut==='en_attente')){majFin(it,{statut:'verif'});setTimeout(function(){sonder(it,e.partie,0);},e.reessayerDans||3000);return;}
  if(r.statut===401){majFin(it,{statut:'reseau',erreur:c});var tma=initDataTg();if(tma)apiAppel('POST','/api/session',avecParrain({version:VERSION}),{auth:'tma '+tma}).then(finSession);return;}
  if(r.statut===0||r.statut===429||(r.statut>=500&&c!=='rejeu_delai'&&c!=='rejeu_echec')){majFin(it,{statut:'reseau',erreur:c});reessayer(it);return;}
  /* réponse définitive : refus, ou incident du serveur (la partie y est conservée, l'organisateur peut la relancer) */
  retirerAttente(it.k);majFin(it,{statut:r.statut>=500?'incident':'refusee',erreur:c});
  if(!courant)afficherMsg(texteRefus(e),C.danger);
  rafraichir();
}
function sonder(it,id,n){
  apiAppel('GET','/api/partie/'+id).then(function(r){var e=r.json||{};
    if(r.statut===200&&e.statut==='en_attente'){if(n<200)setTimeout(function(){sonder(it,id,n+1);},3000);return;}
    if(r.statut===200&&e.statut==='validee'){resultatFin(it,{statut:200,json:e});return;}
    if(r.statut===200){resultatFin(it,{statut:e.statut==='erreur'?503:422,json:{erreur:e.erreur}});return;}
    majFin(it,{statut:'reseau',erreur:e.erreur});reessayer(it);});

/* 0.10 : bonus de fidélité en attente de la relecture du post X d'hier : l'écran de fin relit la partie (toutes les 20 s,
   10 minutes au plus, tant qu'elle reste affichée) ; le serveur l'accorde ou l'annule avant la clôture du jour */
function suivreFidelite(k,id,n){
  if(!NET.fin||NET.fin.k!==k||n>=30||!connecte())return;
  apiAppel('GET','/api/partie/'+id).then(function(r){var e=r.json||{};
    if(!NET.fin||NET.fin.k!==k)return;
    if(r.statut===200&&e.statut==='validee'){
      if(typeof e.score==='number')NET.fin.score=e.score;if(typeof e.scoreBrut==='number')NET.fin.scoreBrut=e.scoreBrut;
      NET.fin.fidelite=typeof e.fidelite==='string'?e.fidelite:null;NET.fin.fidelitePourcent=typeof e.fidelitePourcent==='number'?e.fidelitePourcent:0;
      if(NET.fin.fidelite!=='en_attente'){rafraichir();return;}}
    else if(r.statut!==0&&r.statut<500)return;
    setTimeout(function(){suivreFidelite(k,id,n+1);},20000);});
}
function reessayer(it){
  it.n=(it.n||0)+1;var d=Math.min(60000,3000*Math.pow(2,Math.min(5,it.n)));
  setTimeout(function(){if(connecte()&&lireAttentes().some(function(x){return x.k===it.k;}))envoyerFin(it);},d);
}
/* ligne d'état de la partie terminée, sur l'écran de fin */
function ligneServeur(){
  if(REVOIR)return null;
  if(!classee)return null;
  if(!partieSrv)return[T('net.nonClasse'),'rgba(246,241,231,0.6)'];
  var f=NET.fin;if(!f)return null;
  /* 0.8 : partie d'un concours : rang et total dans le concours */
  if(f.statut==='validee'&&f.rangConcours)return[T('net.valideRangConcours',f.rangConcours,fmtNb(f.scoreConcours||f.score)),C.vert];
  if(f.statut==='validee')return[f.rangJour?T('net.valideRang',f.rangJour,fmtNb(f.scoreJour||f.score)):T('net.valide'),C.vert];
  if(f.statut==='refusee')return[texteRefus(f.erreur),C.danger];
  if(f.statut==='incident')return[texteErreur(f.erreur),C.or];
  if(f.statut==='reseau')return[T('net.enAttente'),C.or];
  return[T('net.verif'),C.cyan];
}
/* 0.10 : ligne du bonus de fidélité sous la ligne du serveur (partie classée validée, serveur 0.10 seulement) */
function ligneFidelite(){
  if(REVOIR||!classee||!partieSrv)return null;

  if(f.fidelite==='annule')return[T('fid.finAnnule'),C.danger];
  if(f.fidelite==='expire')return[T('fid.finExpire'),'rgba(246,241,231,0.75)'];

   0.7 : L'HYMNE (fichiers audio en flux, facultatifs)
   Titre et menus : hymne.m4a en boucle ; fin de partie : hymne-fin.m4a ;
   victoire : hymne-victoire.m4a. Démarrage au premier toucher, fondu à
   l'entrée en partie, jamais en même temps que la musique générée,
   coupé avec le son et quand la page passe en arrière-plan.

var HYMNE_VOL=0.6,HY={el:{},g:{},vol:{titre:0,fin:0,victoire:0},fini:{},absent:{},debloque:false,dern:''};
var HY_FICHIERS={titre:'assets/hymne.m4a',fin:'assets/hymne-fin.m4a',victoire:'assets/hymne-victoire.m4a'};

  if(HY.absent[k])return null;if(HY.el[k])return HY.el[k];
  var a;try{if(typeof Audio==='undefined')throw 0;a=new Audio();}catch(e){HY.absent[k]=1;return null;}
  try{
    a.preload=k==='titre'?'auto':'metadata';a.loop=k==='titre';a.src=HY_FICHIERS[k];
    if(a.addEventListener){a.addEventListener('error',function(){HY.absent[k]=1;});a.addEventListener('ended',function(){HY.fini[k]=1;});}
    /* volume par Web Audio quand c'est possible (iOS ignore le volume d'un élément audio) */
    if(AU.c&&AU.c.createMediaElementSource){try{var s=AU.c.createMediaElementSource(a),g=AU.c.createGain();g.gain.value=0;s.connect(g);g.connect(AU.c.destination);HY.g[k]=g;}catch(e){}}
    if(!HY.g[k])a.volume=0;
  }catch(e){HY.absent[k]=1;return null;}
  HY.el[k]=a;return a;
}
/* premier geste : les trois éléments sont « débloqués » (lecture lancée dans le geste, puis arrêtée) */
function hymneDebloquer(){
  if(HY.debloque)return;HY.debloque=true;
  ['titre','fin','victoire'].forEach(function(k){var a=hymneEl(k);if(!a||k===hymneVoulu())return;
    try{var p=a.play();if(p&&p.then)p.then(function(){if(hymneVoulu()!==k){a.pause();try{a.currentTime=0;}catch(e){}}},function(){});}catch(e){}});
  majHymne(0);
}
function hymneVoulu(){
  if(!HY.debloque||!SAUV.son)return'';
  try{if(document.hidden)return'';}catch(e){}
  if(ecran==='entree'||ecran==='titre'||ecran==='connexion'||ecran==='profil'||ecran==='boosts'||ecran==='classement'||ecran==='lots'||ecran==='parrainage')return tDepart>=0?'':'titre';
  if(ecran==='fin'&&!REVOIR&&S)return S.victoire?'victoire':'fin';
  return'';
}
function hymneVolume(k,v){var g=HY.g[k];try{if(g)g.gain.value=v;else if(HY.el[k])HY.el[k].volume=Math.max(0,Math.min(1,v));}catch(e){}}
function majHymne(dt){
  var v=hymneVoulu(),k,a,c;
  if(v!==HY.dern){if(v==='fin'||v==='victoire'){HY.fini[v]=0;a=hymneEl(v);if(a){try{a.currentTime=0;}catch(e){}}}HY.dern=v;}
  for(k in HY_FICHIERS){
    a=HY.el[k];if(!a&&k!==v)continue;if(!a)a=hymneEl(k);if(!a)continue;
    if(!HY.g[k]&&AU.c&&AU.c.state==='running'&&AU.c.createMediaElementSource&&!HY.sansWA)brancherHymne(k,a);
    c=(k===v&&!HY.fini[k])?HYMNE_VOL:0;
    if(HY.vol[k]<c)HY.vol[k]=Math.min(c,HY.vol[k]+dt/1.2*HYMNE_VOL);else if(HY.vol[k]>c)HY.vol[k]=Math.max(c,HY.vol[k]-dt/0.6*HYMNE_VOL);

    if(c>0&&a.paused&&!HY.fini[k]){try{var p=a.play();if(p&&p.catch)p.catch(function(){});}catch(e){}}
    else if(HY.vol[k]<=0.001&&!a.paused&&!(k==='titre'&&HY.autoEnCours)){try{a.pause();}catch(e){}}
  }
}
/* élément créé avant le contexte audio (lecture automatique) : branché sur Web Audio dès qu'il tourne */
function brancherHymne(k,a){try{var s=AU.c.createMediaElementSource(a),g=AU.c.createGain();g.gain.value=HY.vol[k];s.connect(g);g.connect(AU.c.destination);HY.g[k]=g;a.volume=1;}catch(e){HY.sansWA=true;}}

  if(HY.debloque||!SAUV.son)return;
  var a=hymneEl('titre');if(!a)return;
  try{a.volume=0;HY.autoEnCours=true;var p=a.play();if(p&&p.then)p.then(function(){HY.autoEnCours=false;if(!HY.debloque){HY.debloque=true;HY.auto=true;}},function(){HY.autoEnCours=false;try{a.pause();}catch(e){}});else HY.autoEnCours=false;}catch(e){HY.autoEnCours=false;}
}
function hymneEntendu(){for(var k in HY.vol)if(HY.vol[k]>0.02&&HY.el[k]&&!HY.el[k].paused)return true;return false;}
function hymneArreterTout(){for(var k in HY.el){try{HY.el[k].pause();}catch(e){}HY.vol[k]=0;hymneVolume(k,0);}}

      var v=j&&typeof j.version==='string'?j.version.trim():'';
